<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 220" width="100%" height="100%">
  <defs>
    <!-- Background subtle glow -->
    <radialGradient id="glowGrad" cx="20%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FF5722" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#06B6D4" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Speed Flame Gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3D00" />
      <stop offset="45%" stop-color="#FF9100" />
      <stop offset="100%" stop-color="#FFD600" />
    </linearGradient>

    <!-- Cyan Energy Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#00B0FF" />
      <stop offset="100%" stop-color="#2979FF" />
    </linearGradient>

    <!-- Text Metallic Silver/White Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FCD34D" />
    </linearGradient>

    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <rect x="0" y="0" width="820" height="220" fill="url(#glowGrad)" rx="16" />

  <!-- ============================================== -->
  <!-- 1. DYNAMIC SPEED INFINITY EMBLEM (LEFT ICON)   -->
  <!-- ============================================== -->
  <g transform="translate(18, 12)">
    <!-- Speed Motion Trails behind loop -->
    <path d="M 30,120 L 70,80 L 100,80 L 60,120 Z" fill="#FF3D00" opacity="0.35" />
    <path d="M 45,135 L 85,95 L 115,95 L 75,135 Z" fill="#FF9100" opacity="0.45" />
    <path d="M 60,150 L 100,110 L 130,110 L 90,150 Z" fill="#00E5FF" opacity="0.35" />

    <!-- Left Loop of Infinity (Flame & Energy) -->
    <path d="M 115,98 C 90,65 52,65 30,90 C 8,115 8,155 35,178 C 60,200 98,195 125,165 L 175,115 C 200,85 238,80 262,102 C 285,125 285,165 260,190 C 235,215 195,210 170,180" 
          fill="none" 
          stroke="url(#flameGrad)" 
          stroke-width="15" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#dropGlow)" />

    <!-- Right Loop of Infinity (Cyan Electric Wave) -->
    <path d="M 175,115 C 200,85 238,80 262,102 C 285,125 285,165 260,190 C 235,215 195,210 170,180 L 120,130 C 95,100 58,105 35,128 C 12,150 12,190 38,212" 
          fill="none" 
          stroke="url(#cyanGrad)" 
          stroke-width="11" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Speed Dash Stripes along track -->
    <line x1="85" y1="80" x2="120" y2="80" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.9" />
    <line x1="190" y1="205" x2="225" y2="205" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.9" />

    <!-- DYNAMIC SPRINTER RUNNER SILHOUETTE (IN CENTER-RIGHT OF ICON) -->
    <g transform="translate(142, 62) scale(0.72)" fill="#FFFFFF">
      <!-- Head -->
      <circle cx="58" cy="18" r="8.5" fill="#FFFFFF" />
      <!-- Torso angled forward for sprint speed -->
      <path d="M 52,28 L 64,30 L 52,58 L 40,56 Z" fill="#FFFFFF" />
      <!-- Front Arm Driving Forward -->
      <path d="M 55,32 L 72,42 L 84,36" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" fill="none" />
      <!-- Back Arm Pumping Backwards -->
      <path d="M 45,34 L 32,46 L 22,40" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" fill="none" />
      <!-- Lead Leg Exploding Forward (Bent at Knee) -->
      <path d="M 48,56 L 68,68 L 78,88" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <!-- Trail Leg Extended Backwards in Full Stride -->
      <path d="M 44,56 L 26,72 L 8,82" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <!-- Forward Speed Whiskers -->
      <line x1="90" y1="36" x2="108" y2="36" stroke="#00E5FF" stroke-width="3" stroke-linecap="round" />
      <line x1="84" y1="46" x2="98" y2="46" stroke="#00E5FF" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- Star Burst / Finish Line Spark -->
    <polygon points="152,42 155,48 162,50 156,54 157,60 152,56 147,60 148,54 142,50 149,48" fill="#FFD600" />
  </g>

  <!-- ============================================== -->
  <!-- 2. TYPOGRAPHY: INFINITY MARATHON 2027          -->
  <!-- ============================================== -->
  <g transform="translate(325, 25)">
    <!-- Brand Wordmark: INFINITY -->
    <text x="0" y="72" 
          font-family="'Montserrat', 'Arial Black', -apple-system, sans-serif" 
          font-weight="900" 
          font-style="italic" 
          font-size="64" 
          letter-spacing="3" 
          fill="url(#textGrad)">
      INFINITY
    </text>

    <!-- Brand Wordmark: MARATHON with Flame/Gold Gradient -->
    <text x="325" y="72" 
          font-family="'Montserrat', 'Arial Black', -apple-system, sans-serif" 
          font-weight="900" 
          font-style="italic" 
          font-size="64" 
          letter-spacing="4" 
          fill="url(#flameGrad)"
          filter="url(#dropGlow)">
      2027
    </text>

    <!-- Subtitle: MARATHON Category & City Tour -->
    <text x="2" y="112" 
          font-family="'Montserrat', 'Arial', sans-serif" 
          font-weight="800" 
          font-size="28" 
          letter-spacing="12" 
          fill="url(#cyanGrad)">
      MARATHON
    </text>

    <!-- Decorative Accent Line with Chevron Arrow -->
    <line x1="2" y1="128" x2="465" y2="128" stroke="url(#flameGrad)" stroke-width="3.5" stroke-linecap="round" />
    <polygon points="465,124 476,128 465,132" fill="#FF9100" />

    <!-- Tagline Badge: RUN BEYOND LIMITS | 12 CITIES · 3K · 5K · 10K -->
    <g transform="translate(0, 142)">
      <rect x="0" y="0" width="470" height="34" rx="6" fill="#0F172A" stroke="rgba(255,255,255,0.18)" stroke-width="1.2" />
      <circle cx="16" cy="17" r="4" fill="#00E5FF" />
      <text x="28" y="22" 
            font-family="'Montserrat', 'Segoe UI', sans-serif" 
            font-weight="800" 
            font-size="13" 
            letter-spacing="2.5" 
            fill="#F8FAFC">
        RUN BEYOND LIMITS
      </text>

      <line x1="210" y1="8" x2="210" y2="26" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />

      <text x="222" y="22" 
            font-family="'Montserrat', 'Segoe UI', sans-serif" 
            font-weight="700" 
            font-size="11.5" 
            letter-spacing="1.5" 
            fill="url(#goldGrad)">
        12 CITIES • 3K • 5K • 10K
      </text>
    </g>
  </g>
</svg>
